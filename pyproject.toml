[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hw2a000ff"
version = "1.0.0"
description = "Convert Hammerwatch (HWM) assets to the A000FF format used by Heroes of Hammerwatch, Hammerwatch II and the Anniversary Edition."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["hammerwatch", "a000ff", "ssbd", "modding", "converter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Only needed to re-encode non-32bpp PNGs; without it they are copied as-is.
png = ["pillow>=10.0"]
dev = ["pytest>=8.0", "pillow>=10.0"]

[project.scripts]
hw2a000ff = "hw2a000ff.cli:main"

[project.urls]
Homepage = "https://github.com/bennpham/HW2A000FF-AllPlatform-Remake"
Upstream = "https://github.com/bennpham/hw2a000ff"

[tool.hatch.build.targets.wheel]
packages = ["src/hw2a000ff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
